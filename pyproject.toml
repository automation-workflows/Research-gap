[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-gap"
version = "0.1.0"
description = "Local, scriptable research-gap analysis pipeline for arXiv papers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["arxiv", "research", "gap-analysis", "nlp", "grobid"]
dependencies = [
    "requests>=2.28",
    "lxml>=4.9",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
]

[project.scripts]
research-gap = "research_gap.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["research_gap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
